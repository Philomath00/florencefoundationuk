<section style="padding:64px;font-family:'Plus Jakarta Sans',sans-serif">

    </div>
    <div id="1b" style="display:flex;flex-direction:column;gap:14px">
      <span style="font-size:14px;font-weight:700;color:#302F35">Tablet · 768</span>

    </div>
    <div id="1c" style="display:flex;flex-direction:column;gap:14px">
