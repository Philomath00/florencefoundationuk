<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
<style>a{color:#6A62D6;text-decoration:none}a:hover{color:#5850C4}:focus-visible{outline:3px solid #918AF0;outline-offset:3px}@keyframes ffDrawerIn{from{transform:translateX(100%)}to{transform:translateX(0)}}@keyframes ffFade{from{opacity:0}to{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style>
</helmet>
<header style="position:relative;z-index:50;background:rgba(255,255,255,0.97);backdrop-filter:blur(8px);border-bottom:1px solid #ECE9E6;font-family:'DM Sans',sans-serif;transition:box-shadow .3s">
  <div style="max-width:1320px;margin:0 auto;padding:0 24px;height:{{ barH }};display:flex;align-items:center;justify-content:space-between;gap:24px;transition:height .3s">
    <a href="Home.dc.html" aria-label="Florence Foundation home" style="display:flex;align-items:center;flex-shrink:0">
      <img src="assets/logo-color.png" alt="Florence Foundation" style="height:52px;width:auto;display:block">
    </a>
    <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
      <nav aria-label="Main" style="display:flex;align-items:center;gap:36px">
        <sc-for list="{{ items }}" as="it" hint-placeholder-count="6">
          <a href="{{ it.href }}" aria-current="{{ it.current }}" style="position:relative;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:15px;color:#302F35;padding:10px 0;transition:color .2s" style-hover="color:#6A62D6">
            {{ it.label }}
            <sc-if value="{{ it.active }}" hint-placeholder-val="{{ false }}">
              <span style="position:absolute;left:0;right:0;bottom:2px;height:2px;border-radius:2px;background:#F79AA7"></span>
            </sc-if>
          </a>
        </sc-for>
      </nav>
      <a href="Support%20Us.dc.html" style="display:inline-flex;align-items:center;gap:10px;background:#6A62D6;color:#FFFFFF;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:15px;padding:14px 26px;border-radius:999px;transition:background .2s,transform .2s" style-hover="background:#5850C4;color:#FFFFFF;transform:translateY(-1px)">
        Donate Now
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>
      </a>
    </sc-if>
    <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;align-items:center;gap:10px">
        <a href="Support%20Us.dc.html" style="display:inline-flex;align-items:center;background:#6A62D6;color:#FFFFFF;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:14px;padding:12px 18px;border-radius:999px;min-height:44px;box-sizing:border-box" style-hover="background:#5850C4;color:#FFFFFF">Donate</a>
        <button type="button" onClick="{{ openMenu }}" aria-label="Open menu" aria-expanded="{{ open }}" aria-controls="ff-drawer" style="width:48px;height:48px;border-radius:999px;border:1.5px solid #E2DEDA;background:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#302F35">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"></path></svg>
        </button>
      </div>
    </sc-if>
  </div>
</header>
<sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
  <div onClick="{{ closeMenu }}" style="position:fixed;inset:0;background:rgba(48,47,53,0.55);z-index:90;animation:ffFade .25s ease"></div>
  <div id="ff-drawer" role="dialog" aria-modal="true" aria-label="Site menu" onKeyDown="{{ onDrawerKey }}" style="position:fixed;top:0;right:0;bottom:0;width:min(88vw,380px);background:#FFFFFF;z-index:100;display:flex;flex-direction:column;padding:20px 24px 28px;box-sizing:border-box;animation:ffDrawerIn .32s cubic-bezier(.2,.8,.2,1);font-family:'DM Sans',sans-serif;overflow-y:auto">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:28px">
      <img src="assets/logo-color.png" alt="Florence Foundation" style="height:44px;width:auto">
      <button type="button" ref="{{ closeRef }}" onClick="{{ closeMenu }}" aria-label="Close menu" style="width:48px;height:48px;border-radius:999px;border:1.5px solid #E2DEDA;background:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#302F35">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
      </button>
    </div>
    <nav aria-label="Mobile" style="display:flex;flex-direction:column">
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="6">
        <a href="{{ it.href }}" aria-current="{{ it.current }}" style="display:flex;align-items:center;justify-content:space-between;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:22px;color:#302F35;padding:16px 0;border-bottom:1px solid #F0EDEA" style-hover="color:#6A62D6">
          <span>{{ it.label }}</span>
          <sc-if value="{{ it.active }}" hint-placeholder-val="{{ false }}"><span style="width:8px;height:8px;border-radius:50%;background:#F79AA7"></span></sc-if>
        </a>
      </sc-for>
    </nav>
    <div style="margin-top:auto;padding-top:32px;display:flex;flex-direction:column;gap:16px">
      <a href="Support%20Us.dc.html" style="display:flex;align-items:center;justify-content:space-between;background:#6A62D6;color:#FFFFFF;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:16px;padding:18px 24px;border-radius:999px" style-hover="background:#5850C4;color:#FFFFFF">Donate Now <span aria-hidden="true">→</span></a>
      <p style="margin:0;font-size:14px;line-height:1.5;color:#5E5C66">We Empower People, We Feed People, We Give Hope to People.</p>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1440px&quot;,&quot;height&quot;:&quot;100px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;about&quot;,&quot;projects&quot;,&quot;gallery&quot;,&quot;support&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;'home'|'about'|'projects'|'gallery'|'support'|'contact'&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1440, scrolled: false, open: false };
  closeRef = React.createRef();
  componentDidMount() {
    this.onResize = () => this.setState({ w: window.innerWidth, open: window.innerWidth >= 1080 ? false : this.state.open });
    this.onScroll = () => { const s = window.scrollY > 40; if (s !== this.state.scrolled) this.setState({ scrolled: s }); };
    this.onKey = (e) => { if (e.key === 'Escape' && this.state.open) this.closeMenu(); };
    window.addEventListener('resize', this.onResize);
    window.addEventListener('scroll', this.onScroll, { passive: true });
    window.addEventListener('keydown', this.onKey);
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    window.removeEventListener('scroll', this.onScroll);
    window.removeEventListener('keydown', this.onKey);
  }
  openMenu = () => { this.lastFocus = document.activeElement; this.setState({ open: true }, () => { document.body.style.overflow = 'hidden'; setTimeout(() => this.closeRef.current && this.closeRef.current.focus(), 30); }); };
  closeMenu = () => { document.body.style.overflow = ''; this.setState({ open: false }, () => this.lastFocus && this.lastFocus.focus && this.lastFocus.focus()); };
  onDrawerKey = (e) => {
    if (e.key !== 'Tab') return;
    const f = e.currentTarget.querySelectorAll('a,button');
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  };
  renderVals() {
    const active = this.props.active ?? 'home';
    const pages = [['home','Home','Home.dc.html'],['about','About Us','About%20Us.dc.html'],['projects','Projects','Projects.dc.html'],['gallery','Gallery','Gallery.dc.html'],['support','Support Us','Support%20Us.dc.html'],['contact','Contact Us','Contact%20Us.dc.html']];
    const desktop = this.state.w >= 1080;
    return {
      items: pages.map(([k, label, href]) => ({ label, href, active: k === active, current: k === active ? 'page' : undefined })),
      desktop, mobile: !desktop, open: this.state.open,
      barH: this.state.scrolled ? '76px' : (desktop ? '96px' : '80px'),
      openMenu: this.openMenu, closeMenu: this.closeMenu, onDrawerKey: this.onDrawerKey, closeRef: this.closeRef
    };
  }
}
</script>
</body>
</html>
